<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 완료</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 2em;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 1em;
        }
        a {
            text-decoration: none;
            padding: 0.8em 1.5em;
            margin: 0.5em;
            border-radius: 5px;
            font-size: 1rem;
        }
        .home-button {
            background-color: #4CAF50;
            color: white;
        }
        .login-button {
            background-color: #008CBA;
            color: white;
        }
        a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>회원가입이 완료되었습니다!</h1>
        <a href="/" class="home-button">홈으로 돌아가기</a>
        <a href="/login" class="login-button">로그인하기</a>
    </div>
</body>
</html>
